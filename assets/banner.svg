<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0A1A"/>
      <stop offset="50%" stop-color="#1A0F2E"/>
      <stop offset="100%" stop-color="#0F0A1A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.05" stroke="#7C3AED" stroke-width="0.5">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="200" cy="160" r="120" fill="none" stroke="#7C3AED" stroke-width="0.5" opacity="0.15" stroke-dasharray="8 4"/>
  <circle cx="200" cy="160" r="80" fill="none" stroke="#06B6D4" stroke-width="0.3" opacity="0.1"/>
  <circle cx="1080" cy="160" r="100" fill="none" stroke="#06B6D4" stroke-width="0.5" opacity="0.1" stroke-dasharray="4 8"/>

  <!-- Data particles -->
  <g font-family="monospace" font-size="10" opacity="0.15">
    <text x="100" y="50" fill="#7C3AED">01001</text>
    <text x="300" y="280" fill="#06B6D4">10110</text>
    <text x="500" y="40" fill="#8B5CF6">0xFF</text>
    <text x="800" y="290" fill="#06B6D4">0x00</text>
    <text x="1100" y="60" fill="#7C3AED">10101</text>
    <text x="950" y="30" fill="#06B6D4">OK</text>
    <text x="700" y="280" fill="#C4B5FD">✓</text>
  </g>

  <!-- Main text -->
  <text x="640" y="135" text-anchor="middle" font-family="monospace" font-size="64" font-weight="bold" fill="#C4B5FD" filter="url(#glow)">CID</text>
  <text x="640" y="175" text-anchor="middle" font-family="monospace" font-size="14" fill="#8B5CF6" letter-spacing="8">CALIBRATED INFERENCE DEVICE</text>

  <!-- Accent line -->
  <line x1="440" y1="200" x2="840" y2="200" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="640" y="230" text-anchor="middle" font-family="monospace" font-size="12" fill="#06B6D4" opacity="0.7">per-token validation for LLMs</text>
  <text x="640" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#7C3AED" opacity="0.5">5 gates · 1,606 facts · 0.0045ms</text>

  <!-- Wintermore branding -->
  <text x="640" y="300" text-anchor="middle" font-family="monospace" font-size="9" fill="#4C1D95" opacity="0.4">WINTERMORE HOUSEKEEPING</text>
</svg>
